<section class="feedbacks" aria-labelledby="feedbacks-title">
  <div class="container">
    <div class="feedbacks-header">
      <svg class="icon-decoration" width="300" height="20" aria-hidden="true">
        <use href="/img/sprite.svg#icon-decoration"></use>
      </svg>
      <h2 class="feedbacks-title" id="feedbacks-title">
        Words from Our Wonderful Couples
      </h2>
      <p class="feedbacks-descr">
        Read what the couples who entrusted us with their most precious memories
        have to say.
      </p>
    </div>

    <div class="feedbacks-slider swiper">
      <ul class="feedbacks-list swiper-wrapper"></ul>
    </div>

    <div class="feedbacks-bottom">
      <div class="feedbacks-pagination"></div>

      <div class="feedbacks-navigation">
        <button
          class="feedbacks-button feedbacks-button-prev"
          type="button"
          aria-label="Previous feedback"
        >
          <svg
            class="feedbacks-button-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-arrow-back"></use>
          </svg>
        </button>

        <button
          class="feedbacks-button feedbacks-button-next"
          type="button"
          aria-label="Next feedback"
        >
          <svg
            class="feedbacks-button-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-arrow-forward"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
