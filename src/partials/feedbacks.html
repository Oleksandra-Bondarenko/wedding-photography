<section class="feedbacks">
  <div class="container">
    <svg class="icon-decoration" width="300" height="20" aria-hidden="true">
      <use href="/img/sprite.svg#icon-decoration"></use>
    </svg>

    <div class="feedbacks-header">
      <h2 class="feedbacks-title">Words from Our Wonderful Couples</h2>
      <p class="feedbacks-descr">
        Read what the couples who entrusted us with their most precious memories
        have to say.
      </p>
    </div>

    <div class="feedbacks-slider swiper">
      <ul class="feedbacks-list swiper-wrapper"></ul>
    </div>

    <div class="feedbacks-nav">
      <div class="swiper-pagination"></div>

      <div class="feedbacks-buttons">
        <button
          class="feedbacks-btn swiper-button-prev"
          type="button"
          aria-label="Previous feedback"
        >
          <svg
            class="feedbacks-btn-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-arrow-back"></use>
          </svg>
        </button>

        <button
          class="feedbacks-btn swiper-button-next"
          type="button"
          aria-label="Next feedback"
        >
          <svg
            class="feedbacks-btn-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-arrow-forward"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
